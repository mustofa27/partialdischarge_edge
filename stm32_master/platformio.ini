; PlatformIO Project Configuration File
; STM32F407G-DISC1 (Discovery board) sending sensor data over Bluetooth (HC-05) via USART1
;
; Wiring (HC-05 6-pin module -> STM32F407 Discovery):
;   HC-05 VCC   -> 5V
;   HC-05 GND   -> GND
;   HC-05 TXD   -> PA10 (USART1_RX)
;   HC-05 RXD   -> PA9 (USART1_TX)
;   HC-05 STATE -> PA8 (GPIO_Input, optional - indicates connection status)
;   HC-05 EN    -> PA0 (GPIO_Output, optional - held high for normal mode, low for AT command mode)
;
; Default HC-05 baud rate is 9600 (unless it was reconfigured with AT commands).

[env:disco_f407vg]
platform = ststm32
board = disco_f407vg
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
